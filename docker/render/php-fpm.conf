; Installed as /usr/local/etc/php-fpm.d/zz-render.conf. It sorts after the image's own
; zz-docker.conf (which listens on TCP 9000), so these settings win.

[www]
; Same-container socket shared with nginx; both run as www-data.
listen = /tmp/php-fpm.sock

; Without this PHP-FPM strips the environment, and Laravel would not see the
; variables Render passes in (APP_KEY, DB_*, ...).
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

; Small, fixed ceiling so a free 512 MB instance is not exhausted.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
